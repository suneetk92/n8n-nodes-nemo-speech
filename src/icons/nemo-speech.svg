<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Solid background, full bleed, rounded like other n8n node icons -->
  <rect x="0" y="0" width="24" height="24" rx="5" fill="#7c3aed"/>
  <!-- Microphone: capsule head -->
  <rect x="9.5" y="3" width="5" height="10" rx="2.5" fill="#ffffff"/>
  <!-- Microphone stand: U-shaped body arc -->
  <path d="M6.5 11.5v1a5.5 5.5 0 0 0 11 0v-1" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Stand post -->
  <line x1="12" y1="18" x2="12" y2="20.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="8.5" y1="20.5" x2="15.5" y2="20.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
</svg>

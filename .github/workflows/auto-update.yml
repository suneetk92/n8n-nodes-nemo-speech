name: Auto-Update Binary

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch: {}   # manual trigger

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current image digest
        id: digest
        run: |
          DIGEST=$(docker pull ghcr.io/ggml-org/whisper.cpp:main 2>&1 | grep -oP 'digest: \K[a-f0-9]+' || true)
          if [ -z "$DIGEST" ]; then
            docker pull -q ghcr.io/ggml-org/whisper.cpp:main >/dev/null 2>&1
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/ggml-org/whisper.cpp:main | cut -d'@' -f2)
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Current image digest: $DIGEST"

      - name: Compare with last known digest
        id: compare
        run: |
          LAST=$(cat .last-image-digest 2>/dev/null || echo "")
          if [ "$LAST" = "${{ steps.digest.outputs.digest }}" ]; then
            echo "No change. Skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Image changed: $LAST -> ${{ steps.digest.outputs.digest }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version + commit + tag
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CURRENT=$(node -p "require('./package.json').version")
          MAJOR=${CURRENT%%.*}
          REST=${CURRENT#*.}
          MINOR=${REST%%.*}
          PATCH=${REST##*.}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEW_VERSION\"/" package.json
          echo "${{ steps.digest.outputs.digest }}" > .last-image-digest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-image-digest package.json
          git commit -m "chore: bump to $NEW_VERSION (whisper.cpp main digest changed)

Image digest: ${{ steps.digest.outputs.digest }}"
          git push origin main
          # tag triggers the Build & Publish workflow (extracts binary, publishes release asset + npm)
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
          echo "Tagged v$NEW_VERSION — Build & Publish will extract + publish."

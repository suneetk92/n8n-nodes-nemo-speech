name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Extract the prebuilt parakeet-cli + libs from the official whisper.cpp main image.
      # This is the source of truth for the bundled binary (no local recompile).
      - name: Extract parakeet-cli (linux-x64)
        run: |
          set -e
          IMG=ghcr.io/ggml-org/whisper.cpp:main
          CID=$(docker create --entrypoint true "$IMG")
          mkdir -p bin/linux-x64
          docker cp "$CID:/app/build/bin/parakeet-cli" bin/linux-x64/
          for f in libparakeet.so.1.9.4 libggml.so.0.25.1 libggml-base.so.0.25.1 libggml-cpu.so.0.25.1; do
            docker cp "$CID:/app/build/bin/$f" bin/linux-x64/
          done
          docker rm "$CID" >/dev/null
          cd bin/linux-x64
          ln -sf libparakeet.so.1.9.4 libparakeet.so.1
          ln -sf libggml.so.0.25.1 libggml.so.0
          ln -sf libggml-base.so.0.25.1 libggml-base.so.0
          ln -sf libggml-cpu.so.0.25.1 libggml-cpu.so.0
          for f in parakeet-cli libparakeet.so.1.9.4 libggml.so.0.25.1 libggml-base.so.0.25.1 libggml-cpu.so.0.25.1; do
            patchelf --force-rpath --set-rpath '$ORIGIN' "$f"
          done
          chmod +x parakeet-cli
          echo "bundled binary set ready:" && ls -la

      - name: Install deps (skip native build)
        run: npm install --ignore-scripts

      - name: Build (tsc)
        run: npm run build

      - name: Smoke test node.execute()
        env:
          PARAKEET_NO_MODEL: '1'   # CI has no 638MB model; the smoke harness injects a path
        run: |
          # Provide a tiny stand-in so the "model exists" check passes without the real weights.
          mkdir -p /tmp/parakeet-ci && touch /tmp/parakeet-ci/fake.bin
          PARAKEET_MODEL_PATH=/tmp/parakeet-ci/fake.bin node -e "
            const {Parakeet}=require('./dist/nodes/Parakeet/Parakeet.node.js');
            console.log('node loads OK, description.name =', new Parakeet().description.name);
          "

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Re-extract the binary so the published tarball is self-contained.
      - name: Extract parakeet-cli (linux-x64)
        run: |
          set -e
          IMG=ghcr.io/ggml-org/whisper.cpp:main
          CID=$(docker create --entrypoint true "$IMG")
          mkdir -p bin/linux-x64
          docker cp "$CID:/app/build/bin/parakeet-cli" bin/linux-x64/
          for f in libparakeet.so.1.9.4 libggml.so.0.25.1 libggml-base.so.0.25.1 libggml-cpu.so.0.25.1; do
            docker cp "$CID:/app/build/bin/$f" bin/linux-x64/
          done
          docker rm "$CID" >/dev/null
          cd bin/linux-x64
          ln -sf libparakeet.so.1.9.4 libparakeet.so.1
          ln -sf libggml.so.0.25.1 libggml.so.0
          ln -sf libggml-base.so.0.25.1 libggml-base.so.0
          ln -sf libggml-cpu.so.0.25.1 libggml-cpu.so.0
          for f in parakeet-cli libparakeet.so.1.9.4 libggml.so.0.25.1 libggml-base.so.0.25.1 libggml-cpu.so.0.25.1; do
            patchelf --force-rpath --set-rpath '$ORIGIN' "$f"
          done
          chmod +x parakeet-cli

      - name: Install deps (skip native build)
        run: npm install --ignore-scripts

      - name: Build (tsc)
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

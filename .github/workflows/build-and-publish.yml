name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Extract the prebuilt parakeet-cli + libs from the official whisper.cpp main image.
      # This is the source of truth for the bundled binary (no local recompile).
      - name: Extract parakeet-cli (linux-x64)
        run: |
          set -e
          IMG=ghcr.io/ggml-org/whisper.cpp:main
          CID=$(docker create --entrypoint true "$IMG")
          rm -rf bin/linux-x64 && mkdir -p bin/linux-x64
          docker cp "$CID:/app/build/bin/parakeet-cli" bin/linux-x64/
          # copy ALL versioned .so files (dynamic — adapts to future releases)
          for f in $(docker cp "$CID:/app/build/bin/." - 2>/dev/null | tar -t 2>/dev/null | grep -oP 'lib[^/]*\.so\.[0-9][^/]*' | sort -u); do
            docker cp "$CID:/app/build/bin/$f" bin/linux-x64/
          done
          docker rm "$CID" >/dev/null
          cd bin/linux-x64
          # create soname symlinks dynamically
          for f in lib*.so.*; do
            base=$(echo "$f" | sed -E 's/^lib(.+)\.so\.([0-9]+)(\..+)?$/lib\1.so.\2/')
            [ "$base" != "$f" ] && ln -sf "$f" "$base"
          done
          # set rpath on all binaries + libs
          for f in parakeet-cli lib*.so.*; do
            patchelf --force-rpath --set-rpath '$ORIGIN' "$f" 2>/dev/null || true
          done
          chmod +x parakeet-cli
          echo "bundled binary set ready:" && ls -la

      - name: Install deps (skip native build)
        run: npm install --ignore-scripts

      - name: Build (tsc)
        run: npm run build

      - name: Smoke test node.execute()
        env:
          PARAKEET_NO_MODEL: '1'   # CI has no 638MB model; the smoke harness injects a path
        run: |
          # Provide a tiny stand-in so the "model exists" check passes without the real weights.
          mkdir -p /tmp/parakeet-ci && touch /tmp/parakeet-ci/fake.bin
          PARAKEET_MODEL_PATH=/tmp/parakeet-ci/fake.bin node -e "
            const {Parakeet}=require('./dist/nodes/Parakeet/Parakeet.node.js');
            console.log('node loads OK, description.name =', new Parakeet().description.name);
          "

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # bin/ is committed to the repo (updated by auto-update workflow). Just build + publish.
      - name: Verify binary present
        run: |
          test -x bin/linux-x64/parakeet-cli || { echo "ERROR: bin/linux-x64/parakeet-cli missing" ; exit 1; }
          ls -la bin/linux-x64/
      - name: Install deps (skip native build)
        run: npm install --ignore-scripts

      - name: Build (tsc)
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

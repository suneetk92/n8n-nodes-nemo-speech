name: Build & Publish

on:
  push:
    branches: [main]
  tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build a fully static parakeet-cli from whisper.cpp source.
      # A static glibc binary has zero runtime shared-lib dependencies, so it
      # runs on both glibc and musl (Alpine) targets — including the official
      # n8n Docker image (n8nio/n8n, Alpine-based).
      - name: Build static parakeet-cli (linux-x64)
        run: |
          set -e
          OUT=/tmp/bin/linux-x64
          rm -rf /tmp/bin && mkdir -p "$OUT"
          docker run --rm -v /tmp/bin:/out debian:bookworm-slim bash -c '
            set -e
            apt-get update -qq >/dev/null
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential cmake git 2>&1 | tail -1
            cd /tmp
            git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git src
            cd src
            mkdir -p build && cd build
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DGGML_STATIC=ON \
              -DCMAKE_EXE_LINKER_FLAGS="-static" \
              -DCMAKE_POSITION_INDEPENDENT_CODE=OFF
            make parakeet-cli -j$(nproc)
            cp bin/parakeet-cli /out/linux-x64/
            chmod +x /out/linux-x64/parakeet-cli
          '
          echo "=== bundle ===" && ls -la "$OUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (skip native build)
        run: npm install --ignore-scripts

      - name: Build (tsc)
        run: npm run build

      - name: Smoke test node loads
        env:
          PARAKEET_CLI_PATH: /tmp/bin/linux-x64/parakeet-cli
        run: |
          node -e "
            const {Parakeet}=require('./dist/nodes/Parakeet/Parakeet.node.js');
            console.log('node loads OK, description.name =', new Parakeet().description.name);
          "

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build static parakeet-cli (linux-x64)
        run: |
          set -e
          OUT=/tmp/bin/linux-x64
          rm -rf /tmp/bin && mkdir -p "$OUT"
          docker run --rm -v /tmp/bin:/out debian:bookworm-slim bash -c '
            set -e
            apt-get update -qq >/dev/null
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential cmake git 2>&1 | tail -1
            cd /tmp
            git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git src
            cd src
            mkdir -p build && cd build
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DGGML_STATIC=ON \
              -DCMAKE_EXE_LINKER_FLAGS="-static" \
              -DCMAKE_POSITION_INDEPENDENT_CODE=OFF
            make parakeet-cli -j$(nproc)
            cp bin/parakeet-cli /out/linux-x64/
            chmod +x /out/linux-x64/parakeet-cli
          '

      - name: Package as tarball
        run: |
          cd /tmp/bin
          tar -czf "parakeet-cli-linux-x64.tar.gz" linux-x64/

      - name: Create GitHub Release with asset
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/bin/parakeet-cli-linux-x64.tar.gz
          draft: false
          prerelease: false

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install deps (skip native build)
        run: npm install --ignore-scripts

      - name: Build (tsc)
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

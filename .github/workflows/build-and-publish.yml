name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Extract the prebuilt parakeet-cli + libs from the official whisper.cpp main image.
      - name: Extract parakeet-cli (linux-x64)
        run: |
          set -e
          IMG=ghcr.io/ggml-org/whisper.cpp:main
          CID=$(docker create --entrypoint true "$IMG")
          rm -rf /tmp/bin/linux-x64 && mkdir -p /tmp/bin/linux-x64
          docker cp "$CID:/app/build/bin/parakeet-cli" /tmp/bin/linux-x64/
          for f in $(docker cp "$CID:/app/build/bin/." - 2>/dev/null | tar -t 2>/dev/null | grep -oP 'lib[^/]*\.so\.[0-9][^/]*' | sort -u); do
            docker cp "$CID:/app/build/bin/$f" /tmp/bin/linux-x64/
          done
          docker rm "$CID" >/dev/null
          cd /tmp/bin/linux-x64
          for f in lib*.so.*; do
            base=$(echo "$f" | sed -E 's/^lib(.+)\.so\.([0-9]+)(\..+)?$/lib\1.so.\2/')
            [ "$base" != "$f" ] && ln -sf "$f" "$base"
          done
          for f in parakeet-cli lib*.so.*; do
            patchelf --force-rpath --set-rpath '$ORIGIN' "$f" 2>/dev/null || true
          done
          chmod +x parakeet-cli
          ls -la

      - name: Install deps (skip native build)
        run: npm install --ignore-scripts

      - name: Build (tsc)
        run: npm run build

      - name: Smoke test node loads
        env:
          PARAKEET_CLI_PATH: /tmp/bin/linux-x64/parakeet-cli
        run: |
          node -e "
            const {Parakeet}=require('./dist/nodes/Parakeet/Parakeet.node.js');
            console.log('node loads OK, description.name =', new Parakeet().description.name);
          "

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract parakeet-cli (linux-x64)
        run: |
          set -e
          IMG=ghcr.io/ggml-org/whisper.cpp:main
          CID=$(docker create --entrypoint true "$IMG")
          rm -rf /tmp/bin/linux-x64 && mkdir -p /tmp/bin/linux-x64
          docker cp "$CID:/app/build/bin/parakeet-cli" /tmp/bin/linux-x64/
          for f in $(docker cp "$CID:/app/build/bin/." - 2>/dev/null | tar -t 2>/dev/null | grep -oP 'lib[^/]*\.so\.[0-9][^/]*' | sort -u); do
            docker cp "$CID:/app/build/bin/$f" /tmp/bin/linux-x64/
          done
          rm -rf /tmp/bin/linux-x64 && mkdir -p /tmp/bin/linux-x64
          cd /tmp/bin/linux-x64
          for f in lib*.so.*; do
            base=$(echo "$f" | sed -E 's/^lib(.+)\.so\.([0-9]+)(\..+)?$/lib\1.so.\2/')
            [ "$base" != "$f" ] && ln -sf "$f" "$base"
          done
          for f in parakeet-cli lib*.so.*; do
            patchelf --force-rpath --set-rpath '$ORIGIN' "$f" 2>/dev/null || true
          done
          chmod +x parakeet-cli

      - name: Package as tarball
        run: |
          cd /tmp/bin
          tar -czf "parakeet-cli-linux-x64.tar.gz" linux-x64/

      - name: Create GitHub Release with asset
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/bin/parakeet-cli-linux-x64.tar.gz
          draft: false
          prerelease: false

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install deps (skip native build)
        run: npm install --ignore-scripts

      - name: Build (tsc)
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Extract the prebuilt parakeet-cli + libs from the official whisper.cpp main image.
      - name: Extract parakeet-cli (linux-x64)
        run: |
          set -e
          IMG=ghcr.io/ggml-org/whisper.cpp:main
          CID=$(docker create --entrypoint true "$IMG")
          OUT=/tmp/bin/linux-x64
          rm -rf /tmp/bin && mkdir -p "$OUT"
          # 1) copy parakeet-cli + all versioned .so from the build dir
          docker cp "$CID:/app/build/bin/parakeet-cli" "$OUT/"
          for f in $(docker cp "$CID:/app/build/bin/." - 2>/dev/null | tar -t 2>/dev/null | grep -oP 'lib[^/]*\.so\.[0-9][^/]*' | sort -u); do
            docker cp "$CID:/app/build/bin/$f" "$OUT/"
          done
          # 2) Copy libgomp.so.1 (OpenMP runtime — missing from slim/base images).
          #    Do NOT copy libstdc++/libgcc_s: they exist in the target container and
          #    bundling newer versions causes glibc symbol conflicts.
          GOMP_PATH=$(docker run --rm --entrypoint ldd "$IMG" /app/build/bin/parakeet-cli 2>/dev/null \
            | grep 'libgomp' | awk '{print $3}' || true)
          if [ -n "$GOMP_PATH" ]; then
            docker run --rm --entrypoint cat "$IMG" "$GOMP_PATH" > "$OUT/libgomp.so.1" \
              && echo "  copied dep: libgomp.so.1"
          fi
          docker rm "$CID" >/dev/null
          cd "$OUT"
          # 3) create soname symlinks for ALL .so files (including newly copied deps)
          for f in lib*.so.*; do
            base=$(echo "$f" | sed -E 's/^lib(.+)\.so\.([0-9]+)(\..+)?$/lib\1.so.\2/')
            [ "$base" != "$f" ] && ln -sf "$f" "$base"
          done
          # 4) set rpath on binary + all libs
          for f in parakeet-cli lib*.so.*; do
            patchelf --force-rpath --set-rpath '$ORIGIN' "$f" 2>/dev/null || true
          done
          chmod +x parakeet-cli
          echo "=== bundle contents ===" && ls -la

      - name: Install deps (skip native build)
        run: npm install --ignore-scripts

      - name: Build (tsc)
        run: npm run build

      - name: Smoke test node loads
        env:
          PARAKEET_CLI_PATH: /tmp/bin/linux-x64/parakeet-cli
        run: |
          node -e "
            const {Parakeet}=require('./dist/nodes/Parakeet/Parakeet.node.js');
            console.log('node loads OK, description.name =', new Parakeet().description.name);
          "

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract parakeet-cli (linux-x64)
        run: |
          set -e
          IMG=ghcr.io/ggml-org/whisper.cpp:main
          CID=$(docker create --entrypoint true "$IMG")
          OUT=/tmp/bin/linux-x64
          rm -rf /tmp/bin && mkdir -p "$OUT"
          docker cp "$CID:/app/build/bin/parakeet-cli" "$OUT/"
          for f in $(docker cp "$CID:/app/build/bin/." - 2>/dev/null | tar -t 2>/dev/null | grep -oP 'lib[^/]*\.so\.[0-9][^/]*' | sort -u); do
            docker cp "$CID:/app/build/bin/$f" "$OUT/"
          done
          GOMP_PATH=$(docker run --rm --entrypoint ldd "$IMG" /app/build/bin/parakeet-cli 2>/dev/null \
            | grep 'libgomp' | awk '{print $3}' || true)
          if [ -n "$GOMP_PATH" ]; then
            docker run --rm --entrypoint cat "$IMG" "$GOMP_PATH" > "$OUT/libgomp.so.1" \
              && echo "  copied dep: libgomp.so.1"
          fi
          docker rm "$CID" >/dev/null
          cd "$OUT"
          for f in lib*.so.*; do
            base=$(echo "$f" | sed -E 's/^lib(.+)\.so\.([0-9]+)(\..+)?$/lib\1.so.\2/')
            [ "$base" != "$f" ] && ln -sf "$f" "$base"
          done
          for f in parakeet-cli lib*.so.*; do
            patchelf --force-rpath --set-rpath '$ORIGIN' "$f" 2>/dev/null || true
          done
          chmod +x parakeet-cli

      - name: Package as tarball
        run: |
          cd /tmp/bin
          tar -czf "parakeet-cli-linux-x64.tar.gz" linux-x64/

      - name: Create GitHub Release with asset
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/bin/parakeet-cli-linux-x64.tar.gz
          draft: false
          prerelease: false

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install deps (skip native build)
        run: npm install --ignore-scripts

      - name: Build (tsc)
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
